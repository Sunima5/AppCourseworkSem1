<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DearDiary</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="DearDiary.styles.css" />
    <link rel="icon" href="data:,">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

</head>
<body>

    <div class="status-bar-safe-area"></div>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui" style="display:block;background:#fee2e2;color:#7f1d1d;padding:12px;">
        <strong>Blazor Error:</strong>
        <span id="blazor-error-message"></span>
    </div>

    <!-- 🌙 Dark mode helper -->
    <script>
        window.toggleDarkMode = () => {
            document.body.classList.toggle("dark");
        };
    </script>

    <!-- ✅ External libraries FIRST -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- ✅ Your JS files (correct paths) -->
    <script src="js/editor.js"></script>

    <script src="js/insights.js"></script>

    <!-- ✅ Blazor LAST -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
