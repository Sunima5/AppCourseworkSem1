<script>
    window.theme = {
        setDark: function (isDark) {
            if (!document || !document.body) return;
            document.body.classList.toggle("dark", isDark);
        },
        get: function () {
            return localStorage.getItem("theme");
        },
        set: function (value) {
            localStorage.setItem("theme", value);
        }
    };
</script>
